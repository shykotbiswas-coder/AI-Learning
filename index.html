<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Needs - Smart Learning Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-2.5 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-layer-group text-lg"></i>
                <h1 class="text-lg font-semibold tracking-wide">Daily Needs</h1>
            </div>
            <div class="flex items-center space-x-2">
                <span id="currentDate" class="text-xs bg-indigo-800 px-2.5 py-1 rounded-md"></span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-3 py-4 max-w-6xl">
        
        <!-- Search Bar -->
        <div class="mb-5">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInput" placeholder="যেকোনো ফিচার খুঁজুন..." class="w-full pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 shadow-sm">
            </div>
        </div>

        <!-- Professional Compact Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 mb-8" id="featureGrid">
            
            <div onclick="openModule('vocabulary')" class="bg-white p-3.5 rounded-lg shadow-sm hover:shadow transition cursor-pointer border border-gray-200 flex flex-col items-center text-center">
                <div class="text-indigo-600 text-lg mb-1.5"><i class="fa-solid fa-book"></i></div>
                <h4 class="font-medium text-xs text-gray-700">English Vocab</h4>
            </div>

            <div onclick="openModule('bengali-vocab')" class="bg-white p-3.5 rounded-lg shadow-sm hover:shadow transition cursor-pointer border border-gray-200 flex flex-col items-center text-center">
                <div class="text-emerald-600 text-lg mb-1.5"><i class="fa-solid fa-language"></i></div>
                <h4 class="font-medium text-xs text-gray-700">বাংলা শব্দভান্ডার</h4>
            </div>

            <div onclick="openModule('gk')" class="bg-white p-3.5 rounded-lg shadow-sm hover:shadow transition cursor-pointer border border-gray-200 flex flex-col items-center text-center">
                <div class="text-amber-600 text-lg mb-1.5"><i class="fa-solid fa-globe"></i></div>
                <h4 class="font-medium text-xs text-gray-700">General Knowledge</h4>
            </div>

            <div onclick="openModule('math')" class="bg-white p-3.5 rounded-lg shadow-sm hover:shadow transition cursor-pointer border border-gray-200 flex flex-col items-center text-center">
                <div class="text-rose-600 text-lg mb-1.5"><i class="fa-solid fa-calculator"></i></div>
                <h4 class="font-medium text-xs text-gray-700">Math Tricks</h4>
            </div>

            <div onclick="openModule('daily-learning')" class="bg-white p-3.5 rounded-lg shadow-sm hover:shadow transition cursor-pointer border border-gray-200 flex flex-col items-center text-center">
                <div class="text-purple-600 text-lg mb-1.5"><i class="fa-solid fa-calendar-check"></i></div>
                <h4 class="font-medium text-xs text-gray-700">Daily Learning</h4>
            </div>

            <div onclick="openModule('history')" class="bg-white p-3.5 rounded-lg shadow-sm hover:shadow transition cursor-pointer border border-gray-200 flex flex-col items-center text-center">
                <div class="text-blue-600 text-lg mb-1.5"><i class="fa-solid fa-clock-rotate-left"></i></div>
                <h4 class="font-medium text-xs text-gray-700">Learning History</h4>
            </div>

            <div onclick="openModule('speaking')" class="bg-white p-3.5 rounded-lg shadow-sm hover:shadow transition cursor-pointer border border-gray-200 flex flex-col items-center text-center">
                <div class="text-pink-600 text-lg mb-1.5"><i class="fa-solid fa-comments"></i></div>
                <h4 class="font-medium text-xs text-gray-700">English Speaking</h4>
            </div>

            <div onclick="openModule('mechanical')" class="bg-white p-3.5 rounded-lg shadow-sm hover:shadow transition cursor-pointer border border-gray-200 flex flex-col items-center text-center">
                <div class="text-gray-600 text-lg mb-1.5"><i class="fa-solid fa-cogs"></i></div>
                <h4 class="font-medium text-xs text-gray-700">Mechanical & Tech</h4>
            </div>

            <div onclick="openModule('ai-writing')" class="bg-white p-3.5 rounded-lg shadow-sm hover:shadow transition cursor-pointer border border-gray-200 flex flex-col items-center text-center">
                <div class="text-cyan-600 text-lg mb-1.5"><i class="fa-solid fa-pen-nib"></i></div>
                <h4 class="font-medium text-xs text-gray-700">AI Writing</h4>
            </div>

            <div onclick="openModule('planner')" class="bg-white p-3.5 rounded-lg shadow-sm hover:shadow transition cursor-pointer border border-gray-200 flex flex-col items-center text-center">
                <div class="text-orange-600 text-lg mb-1.5"><i class="fa-solid fa-list-check"></i></div>
                <h4 class="font-medium text-xs text-gray-700">To-do Planner</h4>
            </div>

            <div onclick="openModule('tech-news')" class="bg-white p-3.5 rounded-lg shadow-sm hover:shadow transition cursor-pointer border border-gray-200 flex flex-col items-center text-center">
                <div class="text-red-500 text-lg mb-1.5"><i class="fa-solid fa-newspaper"></i></div>
                <h4 class="font-medium text-xs text-gray-700">Tech News</h4>
            </div>

            <div onclick="openModule('ai-intelligence')" class="bg-white p-3.5 rounded-lg shadow-sm hover:shadow transition cursor-pointer border border-indigo-200 bg-indigo-50 flex flex-col items-center text-center">
                <div class="text-indigo-700 text-lg mb-1.5"><i class="fa-solid fa-brain"></i></div>
                <h4 class="font-medium text-xs text-indigo-900">AI Intelligence</h4>
            </div>

        </div>

        <!-- Modal -->
        <div id="contentModal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center p-3 z-50">
            <div class="bg-white rounded-xl w-full max-w-2xl max-h-[85vh] overflow-y-auto p-5 shadow-xl relative">
                <button onclick="closeModule()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-700 text-xl font-bold">&times;</button>
                <div id="modalContent"></div>
            </div>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
